<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Some Cool games</title>
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <script src="scripts/main.js" type="module" defer></script>
</head>
<body id="top">
     <header class="header">
        <div class="container">
            <div class="logo">
                <img src="assets/steam_msPaint.png" alt="">
            </div>
            <div class="burger">
                <img src="assets/burger-bar.png" alt="Burger Icon">
            </div>
            <nav class="nav">
                <ul class="menu">
                    <li><a href="#top">Home</a></li>
                    <li class="divider"></li>
                    <li><a href="#catalogue">Catalogue</a></li>
                    <li class="divider"></li>
                    <li><a href="#game-form">Add more</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section id="home">
        <div class="hero-image">          
            <div class="hero-text">
                <h2>Some Cool games</h2>
                <p>I've played these alot</p>
                <p>Probably more than I should</p>
            </div>
        </div>
    </section>

    <section id="catalogue">
        <select class ="filter-selector"></select>
        <div class="card-container"></div>
    </section>

    <section id="game-form">
        
        <div class="container"> 
            
            <form class="submissionForm">
                <h2 class="form-header">Add game:</h3>
                <div class="form-grid">
                        <label for="gameName">Game Name:</label>
                        <input type="text" id="gameName" name="name" required>
                        <label for="releaseYear">Release Year:</label>
                        <input type="number" id="releaseYear" name="rYear" min="1" required>
                        <label for="gameCategory">Category:</label>
                        <input type="text" id="gameCategory" name="category" required>
                        <label for="imagePath">Image Path:</label>
                        <input type="text" id="imagePath" name="imagePath" placeholder="url(6:9 ratio, optional)">

                </div>
                
               
                <input class = "submit" type="submit" value="Submit">
            </form>
        </div>
    </section>
    <footer id="About">
            <div class="container">
                <p>Made by Erik Sporsén</p>
                <p>ITHS 2026</p>
            </div>
            <div class="container">
                <p>Graphics design is my passion</p>
            </div>
            <div class="container">
                <p><img src="assets/socials/instagram.png" alt="#"> Instagram</p>
                <p><img src="assets/socials/twitter.png" alt="#"> Twitter</p>
                <p><img src="assets/socials/facebook.png" alt="#"> Facebook</p>
            </div>
        </footer>
</body>
</html>
